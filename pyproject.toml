[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlink-gcp-signal-platform"
version = "0.1.0"
description = "Synthetic, portfolio-safe market-data streaming reference architecture for GCP"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mlink-gcp-demo = "mlink_gcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

